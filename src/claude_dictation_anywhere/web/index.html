<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Dictation Anywhere</title>
<link id="favicon" rel="icon" type="image/svg+xml" href="data:,">
<style>
  :root {
    --bg: #faf9f5; --card: #ffffff; --text: #1f1e1d; --muted: #6b6a66; --line: #e6e3da;
    --accent: #d97757; --accent-text: #ffffff; --warn-bg: #fff4e5; --warn-text: #8a4b00;
    --listening: #dc2828; --transcribing: #3c78dc; --starting: #e6aa28; --paused: #8c8c8c; --capturing: #9658d2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1e1d; --card: #2a2927; --text: #f0eee6; --muted: #a8a59c; --line: #3b3a37;
      --warn-bg: #3a2a12; --warn-text: #ffcf8a;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, "Segoe UI", Inter, Cantarell, "Noto Sans", "DejaVu Sans", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; flex: 1; display: flex; align-items: center; gap: 10px; }
  h1 svg { width: 30px; height: 30px; flex: none; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .pill { padding: 4px 12px; border-radius: 999px; font-weight: 600; font-size: 13px;
          background: var(--accent); color: var(--accent-text); }
  .pill.listening { background: var(--listening); } .pill.transcribing { background: var(--transcribing); }
  .pill.starting { background: var(--starting); } .pill.paused { background: var(--paused); }
  .pill.capturing { background: var(--capturing); }
  .pill.failed { background: var(--listening); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0;
         border-top: 1px solid var(--line); flex-wrap: wrap; }
  .row:first-of-type { border-top: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .warn { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; font-size: 14px;
          display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  .warn button { flex: none; font-size: 13px; }
  .warn.error { background: var(--listening); color: #fff; }
  .warn.error button { color: var(--text); }
  ul.recovery { list-style: none; margin: 0; padding: 0; }
  ul.recovery li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  ul.recovery li:first-child { border-top: 0; }
  ul.recovery .text { flex: 1 1 60%; white-space: pre-wrap; word-break: break-word; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  select, input[type=number] { font: inherit; background: var(--card); color: var(--text);
           border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
  input[type=number] { width: 80px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  .shortcut { font-weight: 600; }
  ul.history { list-style: none; margin: 0; padding: 0; }
  ul.history li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
  ul.history li:first-child { border-top: 0; }
  ul.history .text { flex: 1; white-space: pre-wrap; word-break: break-word; }
  .empty { color: var(--muted); padding: 8px 0; }
  nav.tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
  nav.tabs a { padding: 8px 14px; color: var(--muted); text-decoration: none; font-weight: 600;
               border-bottom: 2px solid transparent; margin-bottom: -1px; }
  nav.tabs a.on { color: var(--text); border-bottom-color: var(--accent); }
  ul.history .when { flex: none; width: 150px; }
  ul.history .when b { display: block; color: var(--text); font-weight: 600; }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px;
           border-top: 1px solid var(--line); margin-top: 4px; }
  .pager button:disabled { opacity: 0.4; cursor: default; }
  @media (max-width: 520px) { ul.history li { flex-wrap: wrap; } ul.history .when { width: 100%; } }
</style>
</head>
<body>
<main>
  <header>
    <h1><span id="logo"></span>Claude Dictation Anywhere</h1>
    <span id="state" class="pill">…</span>
  </header>

  <div id="page-error"></div>
  <div id="warnings"></div>

  <section class="card" id="recovery-card" hidden>
    <h2>Not delivered</h2>
    <ul id="recovery" class="recovery"></ul>
  </section>

  <nav class="tabs">
    <a href="#history" id="tab-history">History</a>
    <a href="#settings" id="tab-settings">Settings</a>
  </nav>

  <div id="panel-history">
  <section class="card">
    <div class="row" style="padding-top:0">
      <h2 style="margin:0">History <span id="history-count" class="muted"></span></h2>
      <span>
        <label class="muted"><input type="checkbox" data-setting="history"> Keep history</label>
        <button id="clear">Clear</button>
      </span>
    </div>
    <ul id="history" class="history"></ul>
    <div class="pager" id="pager" hidden>
      <button id="newer">‹ Newer</button>
      <span id="page-label" class="muted"></span>
      <button id="older">Older ›</button>
    </div>
  </section>
  </div>

  <div id="panel-settings" hidden>
  <section class="card">
    <h2>Shortcut</h2>
    <div class="row">
      <div><span id="shortcut" class="shortcut">…</span><div id="capture-note" class="muted"></div></div>
      <button id="capture" class="primary">Change…</button>
    </div>
    <div class="row">
      <span>Mode</span>
      <span class="seg" data-setting="mode">
        <button data-value="hold">Hold to talk</button>
        <button data-value="toggle">Press to start, press to stop</button>
      </span>
    </div>
    <div class="row" id="grab-row" hidden>
      <label for="grab" title="So Ctrl+U does not also act in the app in front, and a mouse side button does not also mean Back">Hide the shortcut's key from other apps</label>
      <input type="checkbox" id="grab" data-setting="grab">
    </div>
  </section>

  <section class="card">
    <h2>Text</h2>
    <div class="row">
      <span>Put the text in the app under the cursor</span>
      <select data-setting="output">
        <option value="paste">Paste it in one go (uses the clipboard)</option>
        <option value="type">Type it key by key (only into text boxes)</option>
        <option value="none">Don't insert</option>
      </select>
    </div>
    <div class="row">
      <label for="copy_to_clipboard">Also copy to clipboard</label>
      <input type="checkbox" id="copy_to_clipboard" data-setting="copy_to_clipboard">
    </div>
    <div class="row">
      <span>Language</span>
      <select data-setting="language">
        <option value="">English (default)</option>
        <option value="cs">Czech</option><option value="da">Danish</option><option value="nl">Dutch</option>
        <option value="fr">French</option><option value="de">German</option><option value="el">Greek</option>
        <option value="hi">Hindi</option><option value="id">Indonesian</option><option value="it">Italian</option>
        <option value="ja">Japanese</option><option value="ko">Korean</option><option value="no">Norwegian</option>
        <option value="pl">Polish</option><option value="pt">Portuguese</option><option value="ru">Russian</option>
        <option value="es">Spanish</option><option value="sv">Swedish</option><option value="tr">Turkish</option>
        <option value="uk">Ukrainian</option>
      </select>
    </div>
  </section>

  <section class="card">
    <h2>Feedback and memory</h2>
    <div class="row"><label for="sounds">Sound when recording starts and stops</label>
      <input type="checkbox" id="sounds" data-setting="sounds"></div>
    <div class="row"><label for="mute_while_dictating">Mute the speakers while recording</label>
      <input type="checkbox" id="mute_while_dictating" data-setting="mute_while_dictating"></div>
    <div class="row"><label for="notifications">"Listening / Transcribing" banner</label>
      <input type="checkbox" id="notifications" data-setting="notifications"></div>
    <div class="row"><label for="prewarm">Start Claude Code with the app (first press is instant)</label>
      <input type="checkbox" id="prewarm" data-setting="prewarm"></div>
    <div class="row"><label for="idle">Quit Claude Code after idle minutes (0 = never)</label>
      <input type="number" id="idle" min="0" max="1440" data-setting="idle_shutdown_minutes"></div>
    <div class="row"><span>Claude Code</span><span id="claude" class="muted">…</span></div>
  </section>

  <section class="card">
    <div class="row" style="padding-top:0">
      <span>Put every setting back to its default</span>
      <button id="reset">Reset to defaults</button>
    </div>
  </section>
  </div>
</main>

<script>
const TOKEN = "__CDA_TOKEN__";
const STATE_LABELS = {idle: "Ready", starting: "Starting Claude Code…", listening: "Listening…",
  transcribing: "Transcribing…", paused: "Paused", capturing: "Press the new shortcut…",
  failed: "Stopped working; restart the app"};
// Badge colour per state, as in the tray icon (tray.py STATE_COLOURS).
const STATE_COLOURS = {idle: "#d97757", starting: "#e6aa28", listening: "#dc2828",
  transcribing: "#3c78dc", paused: "#8c8c8c", capturing: "#9658d2", failed: "#5a3c3c"};
let lastStatus = null;
let pollFailed = false;
let historyPage = 1;  // 1 = newest transcripts
let capturing = false;  // while true, keys pressed on this page do nothing here

// Every reply carries the status, with the history page this tab shows.
const withPage = path => `${path}?history_page=${historyPage}`;

// The tray's microphone on a 64-unit grid: white capsule, cradle, stem and base on a coloured circle.
function micIcon(colour) {
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">` +
    `<circle cx="32" cy="32" r="30" fill="${colour}"/>` +
    `<rect x="25" y="13" width="14" height="24" rx="7" fill="#fff"/>` +
    `<g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round">` +
    `<path d="M45 33.5A13 11.5 0 0 1 19 33.5M32 45v6M24 51h16"/></g></svg>`;
}

let shownState = null;
function showState(state, label) {
  if (state === shownState) return;  // the page polls every 300 ms; redraw only on change
  shownState = state;
  const svg = micIcon(STATE_COLOURS[state] || STATE_COLOURS.idle);
  document.getElementById("favicon").href = "data:image/svg+xml," + encodeURIComponent(svg);
  document.getElementById("logo").innerHTML = svg;
  document.title = state === "idle" ? "Claude Dictation Anywhere" : `${label} · Claude Dictation Anywhere`;
}
showState("idle", "");

// Failures the page tells apart: the app is gone, this tab is from an earlier run, a bad reply.
class ApiError extends Error {
  constructor(kind, message) { super(message); this.kind = kind; }
}

async function api(method, path, body) {
  let response;
  try {
    response = await fetch(withPage(path), {method, headers: {"X-CDA-Token": TOKEN, "Content-Type": "application/json"},
                                  body: body ? JSON.stringify(body) : undefined});
  } catch {
    throw new ApiError("disconnected", "The app is not running.");
  }
  let data;
  try { data = await response.json(); }
  catch { throw new ApiError("invalid", "The app sent a reply this page cannot read. Reload the page."); }
  if (data.code === "stale_token") throw new ApiError("stale", "This page is from an earlier run of the app.");
  if (!response.ok) throw new ApiError("failed", data.error || response.statusText);
  return data;
}

function showPageError(error) {
  const box = document.getElementById("page-error");
  if (!error) { box.replaceChildren(); return; }
  const div = document.createElement("div"); div.className = "warn error";
  const text = document.createElement("span"); text.textContent = error.message; div.append(text);
  if (error.kind === "stale" || error.kind === "invalid") {
    const reload = document.createElement("button"); reload.textContent = "Reload page";
    reload.onclick = () => location.reload(); div.append(reload);
  }
  box.replaceChildren(div);
}

// Runs an action from a button; a failure is shown on the page, never lost.
async function act(action) {
  try { showPageError(null); await action(); }
  catch (error) { showPageError(error); }
}

async function copyText(text, button) {
  try { await navigator.clipboard.writeText(text); button.textContent = "Copied"; }
  catch { button.textContent = "Could not copy"; }
}

// Rebuild a list only when its data changed; the page polls often, and a rebuild loses focus.
const drawn = new Map();
function changed(key, data) {
  const text = JSON.stringify(data);
  if (drawn.get(key) === text) return false;
  drawn.set(key, text);
  return true;
}

function render(status) {
  lastStatus = status;
  if (pollFailed) { pollFailed = false; showPageError(null); }  // an action's error stays until the next action
  const pill = document.getElementById("state");
  pill.textContent = STATE_LABELS[status.state] || status.state;
  pill.className = "pill " + status.state;
  showState(status.state, pill.textContent);
  document.getElementById("grab-row").hidden = status.platform !== "linux";
  document.getElementById("shortcut").textContent = status.shortcut;
  const notes = {waiting: "Press the key, keys together, or mouse button you want…", timeout: "No press within 15 seconds.",
                 done: "Saved.", rejected: status.capture.message || ""};
  document.getElementById("capture-note").textContent = notes[status.capture.status] || "";
  capturing = status.capture.status === "waiting";
  const claude = status.claude.path ? `${status.claude.version || "?"} · ${status.claude.path}` +
    (status.session_running ? " · running" : " · stopped") : "not found";
  document.getElementById("claude").textContent = claude;

  const warnings = [...status.warnings];
  if (status.last_error) warnings.unshift({text: status.last_error, permission: null});
  if (changed("warnings", warnings)) document.getElementById("warnings").replaceChildren(...warnings.map(w => {
    const div = document.createElement("div"); div.className = "warn";
    const text = document.createElement("span"); text.textContent = w.text; div.append(text);
    if (w.permission) {
      const open = document.createElement("button");
      open.textContent = `Open ${w.permission} settings`;
      open.onclick = () => act(() => api("POST", "/api/open-privacy", {permission: w.permission}));
      div.append(open);
    }
    return div;
  }));

  document.getElementById("recovery-card").hidden = !status.recovery.length;
  if (changed("recovery", status.recovery)) document.getElementById("recovery").replaceChildren(...status.recovery.map(entry => {
    const li = document.createElement("li");
    const text = document.createElement("div"); text.className = "text"; text.textContent = entry.text;
    const reason = document.createElement("div"); reason.className = "muted"; reason.textContent = entry.reason;
    const buttons = document.createElement("span");
    const copy = document.createElement("button"); copy.textContent = "Copy";
    copy.onclick = () => copyText(entry.text, copy);
    const dismiss = document.createElement("button"); dismiss.textContent = "Dismiss";
    dismiss.onclick = () => act(async () => render(await api("POST", "/api/recovery/clear", {id: entry.id})));
    buttons.append(copy, " ", dismiss);
    li.append(text, buttons, reason); return li;
  }));

  for (const el of document.querySelectorAll("[data-setting]")) {
    if (el === document.activeElement) continue;  // don't fight the user's typing
    const value = status.settings[el.dataset.setting];
    if (el.classList.contains("seg")) {
      for (const b of el.querySelectorAll("button")) b.classList.toggle("on", b.dataset.value === value);
    } else if (el.type === "checkbox") el.checked = value;
    else el.value = value;
  }

  renderHistory(status.settings.history, status.history);
}

// "2026-11-07T14:51:09" (local time, as saved) -> "Sat, Nov 7, 2026" and "2:51:09 PM".
function whenSaid(iso) {
  const date = new Date(iso);
  if (isNaN(date)) return [iso, ""];
  return [date.toLocaleDateString(undefined, {weekday: "short", year: "numeric", month: "short", day: "numeric"}),
          date.toLocaleTimeString(undefined, {hour: "numeric", minute: "2-digit", second: "2-digit"})];
}

function renderHistory(enabled, history) {
  // A slow reply for a page this tab has already left is skipped; the next poll brings the right one.
  if (history.page !== Math.min(historyPage, history.pages)) return;
  historyPage = history.page;  // the app clamps it when entries were cleared or dropped
  document.getElementById("history-count").textContent = history.total ? `· ${history.total}` : "";
  const pager = document.getElementById("pager");
  pager.hidden = history.pages <= 1;
  document.getElementById("page-label").textContent = `Page ${history.page} of ${history.pages}`;
  document.getElementById("newer").disabled = history.page <= 1;
  document.getElementById("older").disabled = history.page >= history.pages;
  const list = document.getElementById("history");
  if (!changed("history", [enabled, history])) return;
  if (!enabled) {
    list.innerHTML = '<li class="empty">History is off.</li>';
  } else if (!history.entries.length) {
    list.innerHTML = '<li class="empty">Nothing yet. Hold your shortcut and speak.</li>';
  } else {
    list.replaceChildren(...history.entries.map(entry => {
      const li = document.createElement("li");
      const [day, time] = whenSaid(entry.time);
      const when = document.createElement("div"); when.className = "when muted";
      const strong = document.createElement("b"); strong.textContent = time;
      when.append(strong, day, ` · ${entry.seconds} s`);
      const text = document.createElement("div"); text.className = "text"; text.textContent = entry.text;
      const copy = document.createElement("button"); copy.textContent = "Copy";
      copy.onclick = () => copyText(entry.text, copy);
      li.append(when, text, copy); return li;
    }));
  }
}

async function showHistoryPage(number) {
  historyPage = number;
  await act(async () => render(await api("GET", "/api/status")));
  document.getElementById("panel-history").scrollIntoView({block: "start"});
}

function showTab() {
  const tab = location.hash === "#settings" ? "settings" : "history";
  for (const name of ["history", "settings"]) {
    document.getElementById(`panel-${name}`).hidden = name !== tab;
    document.getElementById(`tab-${name}`).classList.toggle("on", name === tab);
  }
}
window.addEventListener("hashchange", showTab);
showTab();

async function save(name, value) {
  await act(async () => render(await api("POST", "/api/settings", {[name]: value})));
}

for (const el of document.querySelectorAll("[data-setting]")) {
  const name = el.dataset.setting;
  if (el.classList.contains("seg")) {
    for (const b of el.querySelectorAll("button")) b.onclick = () => save(name, b.dataset.value);
  } else if (el.type === "checkbox") el.onchange = () => save(name, el.checked);
  else if (el.type === "number") el.onchange = () => save(name, parseInt(el.value || "0", 10));
  else el.onchange = () => save(name, el.value);
}
document.getElementById("capture").onclick = () => {
  capturing = true;
  act(async () => render(await api("POST", "/api/capture")));
};
// While waiting for a new shortcut, keep this page's browser from acting on it
// (Ctrl+U would open the page source, Ctrl+F the find bar). The app reads the keys itself.
// A few browser keys (Ctrl+W, Ctrl+T, Ctrl+N) cannot be stopped by a page.
document.addEventListener("keydown", event => {
  if (capturing) { event.preventDefault(); event.stopPropagation(); }
}, true);
document.getElementById("newer").onclick = () => showHistoryPage(historyPage - 1);
document.getElementById("older").onclick = () => showHistoryPage(historyPage + 1);
document.getElementById("reset").onclick = () => {
  if (confirm("Put every setting, including the shortcut, back to its default? History is kept."))
    act(async () => render(await api("POST", "/api/settings/reset")));
};
document.getElementById("clear").onclick = () => {
  if (confirm("Delete all saved transcripts?")) act(async () => render(await api("POST", "/api/history/clear")));
};

async function poll() {
  if (!document.hidden || !lastStatus) {  // always load once; then only while visible
    try { render(await api("GET", "/api/status")); }
    catch (error) {
      const pill = document.getElementById("state");
      pill.textContent = {disconnected: "App not running", stale: "Reload needed", invalid: "Bad reply"}[error.kind] || "Error";
      pill.className = "pill paused"; showState("paused", pill.textContent);
      pollFailed = true;
      showPageError(error);
    }
  }
  setTimeout(poll, lastStatus && ["listening", "transcribing", "capturing", "starting"].includes(lastStatus.state) ? 300 : 1500);
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) api("GET", "/api/status").then(render).catch(showPageError);
});
poll();
</script>
</body>
</html>
